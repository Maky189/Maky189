name: GitHub Readme YouTube Cards
on:
  # Disabled automatic schedule to prevent unexpected empty updates.
  # This workflow will now only run when manually triggered from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow the job to commit to the repository when intentionally run
    permissions:
      contents: write
    # Run the GitHub Readme YouTube Cards action
    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCndxohx8qq5k5wzdE01LNoQ
